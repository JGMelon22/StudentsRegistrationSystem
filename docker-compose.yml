services:
  studentsregistrationsystem.api:
    image: ${DOCKER_REGISTRY-}studentsregistrationsystemapi
    build:
      context: .
      dockerfile: src/StudentsRegistrationSystem.API/Dockerfile
    ports:
        - "8080:8080"
        - "8081:8081"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=StudentsRegistrationSystemDb;User=sa;Password=Melon@123;TrustServerCertificate=True
    depends_on:
      - sqlserver
    networks:
     - app-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Melon@123
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
     - app-network

volumes:
  sqlserverdata:

networks:
  app-network:
    driver: bridge